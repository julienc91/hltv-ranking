[project]
name = "hltv-ranking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cloudscraper",
    "python-dateutil>=2.9.0.post0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.uv]
# js2py has an unfixed RCE (CVE-2024-28397). cloudscraper only imports it when
# the js2py interpreter is selected, and we use nodejs, so drop it entirely.
exclude-dependencies = ["js2py"]

[tool.uv.sources]
cloudscraper = { git = "https://github.com/VeNoMouS/cloudscraper.git", rev = "9ea528a8675f1bebd49ff853d142e94988a95178" }
