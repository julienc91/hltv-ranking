[project]
name = "hltv-ranking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cloudscraper",
    "python-dateutil>=2.9.0.post0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.uv]
# Keep transitive dependencies at least as old as Dependabot's cooldown, which
# only covers the direct dependency it bumps.
exclude-newer = "7 days"

[tool.uv.sources]
cloudscraper = { git = "https://github.com/VeNoMouS/cloudscraper.git", rev = "9ea528a8675f1bebd49ff853d142e94988a95178" }
