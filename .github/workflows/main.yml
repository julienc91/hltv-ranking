name: Update
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 20 * * MON'

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the generated ranking to the rankings branch
    steps:
      - name: Checkout code # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.4"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Install dependencies
        run: |
          uv sync
      - name: Change branch
        run: |
          git fetch
          git checkout rankings
          git pull
          git checkout origin/main hltv_ranking.py
          git restore --staged hltv_ranking.py
      - name: Execute script
        run: |
          OUTPUT_FILE=$(uv run hltv_ranking.py '{{ranking_date}}.json')
          echo "RANKING_DATE=$(basename ${OUTPUT_FILE} .json)" >> $GITHUB_ENV
          echo "YEAR=$(basename ${OUTPUT_FILE} .json | cut -c1-4)" >> $GITHUB_ENV
      - name: Create latest.json
        run: |
          rm latest.json
          mkdir -p "$YEAR"
          cp "$RANKING_DATE.json" latest.json
          mv "$RANKING_DATE.json" "$YEAR/"
      - name: Add output to rankings branch
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: HLTV World Ranking ${{ env.RANKING_DATE }}
          branch: rankings
          file_pattern: ${{ env.YEAR }}/${{ env.RANKING_DATE }}.json latest.json
          disable_globbing: true
